services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ADDR: :9901
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-shop}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:9918}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-9901}:9901"
