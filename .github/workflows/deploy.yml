name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, signal-ai-poc]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: signal-ai-poc
      GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build
        run: docker compose build api

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Verify the app is serving
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:9901/api/v1/health &&
               curl -fsS --max-time 5 -o /dev/null http://localhost:9931/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100
